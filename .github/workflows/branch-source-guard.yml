# Promotion source-branch guard (editor) — enforces the branch-protection rule
# that `stable/released` may only be merged FROM `development`.
#
# GitHub branch protection CANNOT natively restrict which branch a PR is merged
# FROM (it only governs the target). This required status check closes that gap,
# mirroring the services and content repos' guards, keeping the editor's
# `development -> stable/released` promotion lane intact.
#
# No paths filter: it must run on EVERY PR into stable/released so it can be a
# reliable REQUIRED status check (see the services repo's
# infra/github/branch-protection.md runbook).
name: branch-source-guard

on:
  pull_request:
    branches:
      - stable/released

permissions:
  contents: read

jobs:
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the allowed promotion source branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          want="development"
          if [ "$HEAD_REF" != "$want" ]; then
            echo "::error title=Illegal promotion source::PRs into '$BASE_REF' may only be opened from '$want' (got '$HEAD_REF')."
            exit 1
          fi
          echo "OK: '$HEAD_REF' -> '$BASE_REF' is an allowed promotion."
